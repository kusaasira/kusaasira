name: Refresh GitHub activity card

on:
  schedule:
    # Daily after most of Kampala's working day has passed.
    - cron: '10 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activity-card.yml'
      - 'scripts/activity_card.py'

permissions:
  contents: write

concurrency:
  group: github-activity-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: python -m pip install 'Pillow==12.1.1'
      - name: Render verified public contribution stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/activity_card.py
      - name: Publish animation on dedicated data branch
        run: |
          mkdir -p "$RUNNER_TEMP/profile-activity"
          cp assets/github-activity.gif assets/github-activity.svg assets/github-activity.json "$RUNNER_TEMP/profile-activity/"
          git reset --hard
          git clean -f assets/github-activity.gif assets/github-activity.svg assets/github-activity.json
          git fetch origin activity-data
          git switch -C activity-data origin/activity-data
          mkdir -p assets
          cp "$RUNNER_TEMP/profile-activity/"* assets/
          git add assets/github-activity.gif assets/github-activity.svg assets/github-activity.json
          if git diff --cached --quiet; then
            echo 'Activity is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(profile): refresh verified GitHub activity counters'
          git push origin HEAD:activity-data
